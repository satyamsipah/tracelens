    matchLabels:
      app.kubernetes.io/name: tracelens
      app.kubernetes.io/instance: tracelens
      app.kubernetes.io/component: assembler
  strategy:
    # Recreate-then-start would drop consumption entirely during a deploy;
    # RollingUpdate with maxSurge 0 keeps at most one partition set moving
    # at a time, so a rebalance never overlaps another rebalance.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracelens
        app.kubernetes.io/instance: tracelens
        app.kubernetes.io/component: assembler
      annotations:
        # Roll the pods when the policy/cardinality ConfigMap changes.
        # Belt and braces: the assembler also hot-reloads policies.yaml on
        # its own by polling mtime, but a projected ConfigMap update can lag
        # by up to the kubelet sync period, and cardinality.yaml is only
        # read at startup.
        checksum/config: 4524ff0b7c2b8dc4aab36dd0ee671dd30196f8cd2db934eb0679a3b5a7f60695
    spec:
      serviceAccountName: tracelens
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Long enough for the in-flight buffer to finish its decisions and for
      # the writer to drain, so a rolling deploy does not force traces
      # through the redelivery path unnecessarily. Must exceed
      # buffer.decisionWait with room for the final ClickHouse write.
      terminationGracePeriodSeconds: 60
      containers:
        - name: assembler
          image: ghcr.io/satyamsipah/tracelens-assembler:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: admin
              containerPort: 9465
          env:
            - name: TRACELENS_CLICKHOUSE_ADDR
              value: "clickhouse:9000"
            - name: TRACELENS_CLICKHOUSE_DB
              value: "tracelens"
            - name: TRACELENS_CLICKHOUSE_USER
              value: "tracelens"
            - name: TRACELENS_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracelens-clickhouse
                  key: clickhouse-password
            - name: TRACELENS_KAFKA_BROKERS
              value: "redpanda:9092"
            - name: TRACELENS_KAFKA_PARTITIONS
              value: "12"
            - name: TRACELENS_TOPIC_SPANS
              value: "spans"
            - name: TRACELENS_TOPIC_LOGS
              value: "logs"
            - name: TRACELENS_TOPIC_METRICS
              value: "metrics"
            - name: TRACELENS_CONSUMER_GROUP
              value: "tracelens-assembler"
            - name: TRACELENS_ADMIN_ADDR
              value: ":9465"
            - name: TRACELENS_POLICY_FILE
              value: /etc/tracelens/policies.yaml
            - name: TRACELENS_CARDINALITY_FILE
              value: /etc/tracelens/cardinality.yaml
            - name: TRACELENS_BUFFER_MAX_TRACES
              value: "50000"
            - name: TRACELENS_BUFFER_MAX_BYTES
