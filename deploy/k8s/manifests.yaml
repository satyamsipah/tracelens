              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness deliberately hits /healthz, which never consults a
          # downstream: a ClickHouse outage must not kill every assembler
          # pod and turn one dependency's bad day into a crash-loop.
