# is decode-and-forward, so its cost tracks request volume directly.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracelens-collector
  labels:
    helm.sh/chart: tracelens-1.0.0
    app.kubernetes.io/name: tracelens
    app.kubernetes.io/instance: tracelens
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tracelens
    app.kubernetes.io/component: collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracelens-collector
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

