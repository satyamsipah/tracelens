# Source: tracelens/templates/collector.yaml
# The OTLP receiver. Stateless and safe behind an ordinary Service: it keys
# every span by trace_id when producing to Kafka, so which collector replica
# handled a span has no bearing on which assembler assembles the trace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelens-collector
  labels:
    helm.sh/chart: tracelens-1.0.0
    app.kubernetes.io/name: tracelens
    app.kubernetes.io/instance: tracelens
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tracelens
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tracelens
      app.kubernetes.io/instance: tracelens
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracelens
        app.kubernetes.io/instance: tracelens
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: tracelens
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # The collector answers OTLP with RESOURCE_EXHAUSTED/429 under
      # backpressure, so a conforming exporter retries. On shutdown it stops
      # accepting first and then drains its bounded queue to Kafka; this
      # grace period is what lets that drain finish instead of dropping
      # spans the client was already told were accepted.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: ghcr.io/satyamsipah/tracelens-collector:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: admin
              containerPort: 9464
          env:
            - name: TRACELENS_KAFKA_BROKERS
              value: "redpanda:9092"
            - name: TRACELENS_KAFKA_PARTITIONS
              value: "12"
            - name: TRACELENS_TOPIC_SPANS
              value: "spans"
            - name: TRACELENS_TOPIC_LOGS
              value: "logs"
            - name: TRACELENS_TOPIC_METRICS
              value: "metrics"
            - name: TRACELENS_OTLP_GRPC_ADDR
              value: ":4317"
            - name: TRACELENS_OTLP_HTTP_ADDR
              value: ":4318"
            - name: TRACELENS_ADMIN_ADDR
              value: ":9464"
            - name: TRACELENS_QUEUE_CAPACITY
              value: "8192"
            - name: TRACELENS_BACKPRESSURE_TRACES
              value: "reject"
          # readiness pings Kafka: a collector that cannot produce would
          # only fill a bounded queue that can never drain, so it should
          # stop receiving OTLP traffic until the broker is back.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

