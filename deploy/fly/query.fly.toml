# Query API. Public, read-only, unauthenticated by design.

app = "tracelens-query"
primary_region = "iad"

[build]
  image = "ghcr.io/satyamsipah/tracelens-query:v1.0.0"

[env]
  TRACELENS_QUERY_HTTP_ADDR = ":8080"
  TRACELENS_ADMIN_ADDR = ":9466"
  TRACELENS_CLICKHOUSE_TLS = "true"
  # The demo is public, so the per-query guards matter more than usual: a
  # single unbounded DSL query would otherwise be a free denial of service
  # against the free-tier ClickHouse behind it.
  TRACELENS_QUERY_TIMEOUT = "15s"
  TRACELENS_QUERY_MAX_ROWS_SCANNED = "20000000"
  # No alert rules on the demo; the file is absent and the query API
  # degrades to "alerting disabled" with a warning rather than refusing to
  # start.
  TRACELENS_ALERT_RULES_FILE = "/etc/tracelens/alerts.yaml"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "get"
  path = "/readyz"
  port = 9466

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
