name: tracelens

services:
  # ---------------------------------------------------------------- storage --
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: tracelens-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: tracelens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      # The tiered storage policy the TTL clauses depend on. Without this the
      # `TO VOLUME 'cold'` migrations fail on a fresh database.
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # 127.0.0.1, NOT localhost: ClickHouse binds 0.0.0.0 (IPv4 only), while
      # localhost resolves to ::1 first, so a localhost probe gets connection
      # refused against a perfectly healthy server.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ----------------------------------------------------------------- broker --
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: tracelens-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # -------------------------------------------------------------- tracelens --
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Explicit: BuildKit defaults to the LAST stage in the file,
      # which is the distroless one. Compose healthchecks run their
      # command INSIDE the container and need a shell and wget.
      target: runtime
      args:
        TARGET: ./cmd/collector
    container_name: tracelens-collector
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      TRACELENS_KAFKA_BROKERS: redpanda:29092
      TRACELENS_OTLP_GRPC_ADDR: ":4317"
      TRACELENS_OTLP_HTTP_ADDR: ":4318"
      TRACELENS_ADMIN_ADDR: ":9464"
      TRACELENS_QUEUE_CAPACITY: "8192"
      TRACELENS_QUEUE_HIGH_WATER_RATIO: "0.8"
      # Reject rather than drop: RESOURCE_EXHAUSTED is retryable, so under
      # transient pressure nothing is lost, only deferred.
      TRACELENS_BACKPRESSURE_TRACES: reject
      TRACELENS_BACKPRESSURE_LOGS: reject
      TRACELENS_BACKPRESSURE_METRICS: reject
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9464/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  assembler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Explicit: BuildKit defaults to the LAST stage in the file,
      # which is the distroless one. Compose healthchecks run their
      # command INSIDE the container and need a shell and wget.
      target: runtime
      args:
        TARGET: ./cmd/assembler
    container_name: tracelens-assembler
    depends_on:
      redpanda: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      TRACELENS_KAFKA_BROKERS: redpanda:29092
      TRACELENS_CLICKHOUSE_ADDR: clickhouse:9000
      TRACELENS_CLICKHOUSE_USER: default
      TRACELENS_CLICKHOUSE_PASSWORD: tracelens
      TRACELENS_ADMIN_ADDR: ":9465"
      TRACELENS_POLICY_FILE: /etc/tracelens/policies.yaml
      TRACELENS_CARDINALITY_FILE: /etc/tracelens/cardinality.yaml
      # Forced-early-decision, not discard: nothing that enters the trace
      # buffer is ever thrown away outright, only decided early under
      # capacity pressure.
      TRACELENS_BUFFER_EVICTION: forced_decision
    volumes:
      # Hot-reloadable: the assembler polls these for changes every
      # TRACELENS_RELOAD_INTERVAL without a restart.
      - ./tracelens/policies.yaml:/etc/tracelens/policies.yaml:ro
      - ./tracelens/cardinality.yaml:/etc/tracelens/cardinality.yaml:ro
    ports:
      - "9465:9465"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9465/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  query:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Explicit: BuildKit defaults to the LAST stage in the file,
      # which is the distroless one. Compose healthchecks run their
      # command INSIDE the container and need a shell and wget.
      target: runtime
      args:
        TARGET: ./cmd/query
    container_name: tracelens-query
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      TRACELENS_CLICKHOUSE_ADDR: clickhouse:9000
      TRACELENS_CLICKHOUSE_USER: default
      TRACELENS_CLICKHOUSE_PASSWORD: tracelens
      TRACELENS_ADMIN_ADDR: ":9466"
      TRACELENS_QUERY_HTTP_ADDR: ":8080"
      TRACELENS_ALERT_RULES_FILE: /etc/tracelens/alerts.yaml
    volumes:
      - ./tracelens/alerts.yaml:/etc/tracelens/alerts.yaml:ro
    ports:
      - "8080:8080"
      - "9466:9466"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9466/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ------------------------------------------------------------------ demo --
  # Four containers, one image, one -service flag. The call graph lives in
  # demo/topology.go so the four cannot drift apart.
  gateway:
    build: &demo-build
      context: ..
      dockerfile: deploy/Dockerfile
      # Explicit: BuildKit defaults to the LAST stage in the file,
      # which is the distroless one. Compose healthchecks run their
      # command INSIDE the container and need a shell and wget.
      target: runtime
      args:
        TARGET: ./demo
    container_name: tracelens-gateway
    depends_on:
      collector: { condition: service_healthy }
    command: ["-service", "gateway"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEMO_LATENCY_MS: "8"
      DEMO_JITTER_MS: "20"
      DEMO_ERROR_RATE: "0.01"
      # Self-drives so `docker compose up` produces end-to-end traces with no
      # extra step.
      DEMO_DRIVE_RPS: "5"
    ports:
      # Host 8080 is cmd/query's port (added in phase 3, after this file's
      # demo services already claimed 8080-8083 for their own admin ports) --
      # remapped on the host side only; the container's own listener is
      # still :8080, matching the other demo services' -service flag
      # convention of "each service's own port on both sides".
      - "8084:8080"

  checkout:
    build: *demo-build
    container_name: tracelens-checkout
    depends_on:
      collector: { condition: service_healthy }
    command: ["-service", "checkout"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEMO_LATENCY_MS: "15"
      DEMO_JITTER_MS: "40"
      DEMO_ERROR_RATE: "0.03"
    ports:
      - "8081:8081"

  inventory:
    build: *demo-build
    container_name: tracelens-inventory
    depends_on:
      collector: { condition: service_healthy }
    command: ["-service", "inventory"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEMO_LATENCY_MS: "20"
      DEMO_JITTER_MS: "60"
      DEMO_ERROR_RATE: "0.02"
    ports:
      - "8082:8082"

  payments:
    build: *demo-build
    container_name: tracelens-payments
    depends_on:
      collector: { condition: service_healthy }
    command: ["-service", "payments"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEMO_LATENCY_MS: "35"
      DEMO_JITTER_MS: "90"
      # Deliberately the flakiest service, so the demo produces error traces
      # worth finding.
      DEMO_ERROR_RATE: "0.08"
    ports:
      - "8083:8083"

  # -------------------------------------------------------------- telemetry --
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tracelens-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tracelens-grafana
    depends_on:
      prometheus: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: tracelens
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # The self-monitoring dashboard's storage-size and compression-ratio
      # panels query system.parts directly -- that information has no
      # Prometheus metric behind it, so it needs a second datasource rather
      # than an invented gauge nothing else in the stack would ever populate.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: tracelens-web
    depends_on:
      query: { condition: service_healthy }
    environment:
      # Server components (running inside this container) reach the query
      # API over the compose network; the browser reaches it over localhost,
      # since it runs outside the compose network entirely -- two different
      # addresses for the same service, which is why these are two
      # separate variables rather than one.
      TRACELENS_API_BASE: http://query:8080
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3001:3001"
    healthcheck:
      # 127.0.0.1, not localhost: this alpine image resolves "localhost" to
      # ::1 first, and the server listens on 0.0.0.0 (IPv4) only -- the
      # exact bug DECISIONS.md already recorded once for ClickHouse's own
      # healthcheck, recurring here for the same underlying reason.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  clickhouse-data:
  redpanda-data:
