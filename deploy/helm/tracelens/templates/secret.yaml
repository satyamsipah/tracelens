{{- if and .Values.secrets.create (not .Values.clickhouse.existingSecret) }}
# Convenience only, for demos. In production create this Secret out of band
# (or via an External Secrets operator) and set clickhouse.existingSecret --
# a password passed through `helm install --set` lands in your shell
# history and in Helm's release history in-cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracelens.fullname" . }}-clickhouse
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clickhouse.existingSecretPasswordKey }}: {{ required "set secrets.clickhousePassword, or point clickhouse.existingSecret at a Secret you manage" .Values.secrets.clickhousePassword | quote }}
{{- end }}
