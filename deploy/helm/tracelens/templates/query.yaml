{{- if .Values.query.enabled }}
# The query API. Stateless and freely scalable: every request is answered
# from ClickHouse, so no replica holds anything another replica needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tracelens.fullname" . }}-query
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  {{- if not .Values.query.autoscaling.enabled }}
  replicas: {{ .Values.query.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tracelens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        {{- include "tracelens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: query
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tracelens.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for the longest query the engine will allow
      # (query.queryTimeout) to finish rather than be cut off mid-flight.
      terminationGracePeriodSeconds: 40
      containers:
        - name: query
          image: {{ include "tracelens.image" (list . "query") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9466
          env:
            {{- include "tracelens.clickhouseEnv" . | nindent 12 }}
            - name: TRACELENS_QUERY_HTTP_ADDR
              value: ":8080"
            - name: TRACELENS_ADMIN_ADDR
              value: ":9466"
            - name: TRACELENS_QUERY_TIMEOUT
              value: {{ .Values.query.queryTimeout | quote }}
            # The preflight EXPLAIN-ESTIMATE guard. Without it a single
            # unbounded DSL query is a self-inflicted denial of service.
            - name: TRACELENS_QUERY_MAX_ROWS_SCANNED
              value: {{ .Values.query.maxRowsScanned | quote }}
            - name: TRACELENS_PROMETHEUS_URL
              value: {{ .Values.query.prometheusURL | quote }}
            - name: TRACELENS_ALERT_RULES_FILE
              value: {{ .Values.query.alertRulesFile | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.query.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tracelens
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "tracelens.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracelens.fullname" . }}-query
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
  {{- with .Values.query.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.query.service.type }}
  selector:
    {{- include "tracelens.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: query
  ports:
    - name: http
      port: {{ .Values.query.service.port }}
      targetPort: http
    - name: admin
      port: 9466
      targetPort: admin
{{- if .Values.query.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tracelens.fullname" . }}-query
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  minAvailable: {{ .Values.query.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tracelens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query
{{- end }}
{{- if .Values.query.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tracelens.fullname" . }}-query
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tracelens.fullname" . }}-query
  minReplicas: {{ .Values.query.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.query.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.query.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
