{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tracelens.serviceAccountName" . }}
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC rules ship with this chart: no TraceLens component talks to the
# Kubernetes API. Adding a Role would be granting permissions nothing uses.
automountServiceAccountToken: false
{{- end }}
