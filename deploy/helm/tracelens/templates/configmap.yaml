apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracelens.fullname" . }}-config
  labels:
    {{- include "tracelens.labels" . | nindent 4 }}
data:
  # Hot-reloaded by the assembler, which polls this file's mtime. An invalid
  # edit is logged and the PREVIOUS chain stays active -- it never crashes
  # the assembler or silently disables sampling.
  #
  # Order is load-bearing. attribute_match sits AHEAD of rate_limiting so a
  # debug-flagged trace bypasses the cap entirely rather than being vetoed
  # by an exhausted bucket, and probabilistic MUST be last: a chain where
  # nothing matches is treated as a drop, not a silent 100% keep.
  policies.yaml: |
{{ .Values.policies | indent 4 }}
  cardinality.yaml: |
{{ .Values.cardinality | indent 4 }}
  alerts.yaml: |
{{ .Values.alerts | indent 4 }}
