run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - gocritic

linters-settings:
  errcheck:
    # Deferred Close on a read-only handle is the one place where ignoring an
    # error is genuinely correct rather than lazy.
    check-type-assertions: true
  gocritic:
    disabled-checks:
      - hugeParam # row structs are passed by value deliberately in tests

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
