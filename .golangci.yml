# golangci-lint v2 config. v1 does not support Go 1.25, which go.mod requires
# via golang.org/x/sync and genproto/googleapis/rpc.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are on by default.
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
